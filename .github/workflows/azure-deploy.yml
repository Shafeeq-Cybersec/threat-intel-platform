name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ca9c23a426b2acr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ca9c23a426b2acr.azurecr.io/threat-intel:latest

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update container app
        uses: azure/cli@v1
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp registry set \
              --name threat-intel \
              --resource-group promptshield-rg \
              --server ca9c23a426b2acr.azurecr.io \
              --username ${{ secrets.ACR_USERNAME }} \
              --password ${{ secrets.ACR_PASSWORD }}
            az containerapp update \
              --name threat-intel \
              --resource-group promptshield-rg \
              --image ca9c23a426b2acr.azurecr.io/threat-intel:latest

services:
  - type: web
    name: threat-intel-platform
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /data/threat_intel.db
      # Add these manually in Render dashboard → Environment:
      # VIRUSTOTAL_API_KEY
      # GOOGLE_SAFE_BROWSING_API_KEY
      # ABUSEIPDB_API_KEY
      # GEMINI_API_KEY
      # BREVO_API_KEY
      # ALERT_EMAIL_FROM
      # ALERT_EMAIL_TO
      # GMAIL_TOKEN_B64        (base64 of backend/credentials/token.json)
      # GMAIL_CREDENTIALS_B64  (base64 of backend/credentials/credentials.json)
